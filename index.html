<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lo-tools.be · Digitale hulp voor lichamelijke opvoeding</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#151515;background:#f8f8f8}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e7e7e7;padding:0 22px}.header-inner{max-width:1196px;margin:auto;display:flex;align-items:center;min-height:62px}header a{font-size:17px;letter-spacing:-.4px;font-weight:750;text-decoration:none;color:#151515}main{max-width:1196px;margin:42px auto;padding:0 22px}h1{font-size:clamp(23px,3vw,33px);letter-spacing:-.8px;font-weight:730;margin:0 0 32px}.list{border-top:1px solid #e4e4e4}.tool{border-bottom:1px solid #e4e4e4}.tool-main{display:flex;align-items:center;gap:16px;min-height:83px;padding:16px 0}.tool-title{font-size:clamp(17px,2vw,21px);font-weight:680;letter-spacing:-.35px;flex:1;min-width:0}.info-toggle{border:0;background:transparent;color:#666;font:inherit;font-size:13px;cursor:pointer;padding:12px 7px;white-space:nowrap}.info-toggle:hover{color:#111}.open{display:inline-flex;align-items:center;justify-content:center;min-width:94px;padding:10px 13px;border:1px solid #dcdcdc;border-radius:8px;color:#151515;background:#fff;font-size:13px;font-weight:650;text-decoration:none;white-space:nowrap}.open:hover{background:#f1f1f1}.detail{padding:0 0 25px;max-width:820px}.detail[hidden]{display:none}.keywords{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}.keyword{font-size:12px;background:#ededed;border-radius:5px;color:#555;padding:5px 9px}.description{font-size:14px;color:#555;line-height:1.7;white-space:pre-line;margin:0}.empty{color:#666;padding:25px 0}.footer{max-width:1196px;margin:72px auto 0;padding:20px 22px 28px;border-top:1px solid #e4e4e4;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#777;font-size:12px}.footer a{color:#555;text-decoration:none}.footer a:hover{text-decoration:underline}@media(max-width:600px){header{padding:0 16px}.header-inner{min-height:56px}header a{font-size:15px}main{margin:30px auto;padding:0 16px}h1{margin-bottom:25px;font-size:24px}.tool-main{gap:8px;min-height:75px}.tool-title{font-size:17px}.info-toggle{font-size:12px;padding:10px 3px}.open{min-width:0;padding:9px 10px;font-size:12px}}
</style></head><body><header><div class="header-inner"><a href="./">lo-tools.be</a></div></header><main><h1>Digitale hulp voor lichamelijke opvoeding</h1><div id="tools" class="list" aria-live="polite"></div></main><footer class="footer"><span>© 2026 · Tom Madou</span><a href="mailto:contact@lo-tools.be">Contact</a></footer>
<script>
const container=document.getElementById('tools');
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(data){
const tools=(Array.isArray(data)?data:Array.isArray(data.tools)?data.tools:[]).filter(t=>t.visible!==false);
container.replaceChildren();
if(!tools.length){container.append(element('p','empty','Nog geen tools beschikbaar.'));return}
for(const t of tools){
const article=element('article','tool'),main=element('div','tool-main');
main.append(element('div','tool-title',t.title||'Naamloze tool'));
const detail=element('div','detail');detail.hidden=true;
const keys=Array.isArray(t.keywords)?t.keywords:String(t.keywords||'').split(',').map(s=>s.trim()).filter(Boolean);
if(keys.length){const tags=element('div','keywords');keys.forEach(k=>tags.append(element('span','keyword',k)));detail.append(tags)}
if(t.description)detail.append(element('p','description',t.description));
if(detail.childElementCount){const btn=element('button','info-toggle','Meer info +');btn.type='button';btn.setAttribute('aria-expanded','false');btn.onclick=()=>{detail.hidden=!detail.hidden;btn.textContent=detail.hidden?'Meer info +':'Minder −';btn.setAttribute('aria-expanded',String(!detail.hidden))};main.append(btn)}
const a=element('a','open','Open ↗');a.href=t.url||t.link||'#';a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',(t.title||'Tool')+' openen');main.append(a);
article.append(main,detail);container.append(article);
}}
fetch('tools.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(render).catch(()=>container.append(element('p','empty','De tools konden niet worden geladen.')));
</script></body></html>
