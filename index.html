<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LO-tools</title>
<meta name="description" content="Praktische, eenvoudige tools voor lichamelijke opvoeding.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#121212;--muted:#6b6b66;--line:#deded8;--accent:#171717;--r:22px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}header{padding:34px 0 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:700;letter-spacing:-.03em}.dot{width:9px;height:9px;background:#111;border-radius:50%}.hero{padding:72px 0 64px;border-bottom:1px solid var(--line)}h1{font-size:clamp(54px,10vw,112px);line-height:.88;letter-spacing:-.075em;margin:0;font-weight:600}.lead{max-width:560px;font-size:clamp(17px,2vw,21px);line-height:1.5;color:var(--muted);margin:32px 0 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;padding:34px 0 18px}.sectionHead h2{margin:0;font-size:16px}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:70px}.card{min-height:240px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:.18s ease}.card:hover{transform:translateY(-3px);border-color:#aaa}.card.featured{grid-column:span 2;min-height:310px}.top{display:flex;justify-content:space-between;gap:20px}.keywords{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px;width:max-content}.arrow{font-size:24px}.card h3{font-size:clamp(25px,3vw,38px);letter-spacing:-.045em;margin:auto 0 10px}.card p{color:var(--muted);line-height:1.5;max-width:580px;margin:0;font-size:14px}footer{border-top:1px solid var(--line);padding:24px 0 42px;color:var(--muted);font-size:12px}@media(max-width:700px){.wrap{width:min(100% - 22px,1120px)}header{padding-top:22px}.hero{padding:52px 0 48px}.grid{grid-template-columns:1fr}.card,.card.featured{grid-column:auto;min-height:220px}.sectionHead{padding-top:26px}}
</style></head><body><div class="wrap"><header><div class="brand">LO-tools</div><div class="dot"></div></header><main><section class="hero"><h1>Tools voor<br>lichamelijke opvoeding</h1></section><div class="sectionHead"><h2>Tools</h2><span class="count" id="count"></span></div><section class="grid" id="grid"></section></main><footer>LO-tools · praktische tools voor bewegingsonderwijs</footer></div><script>
fetch('tools.json?'+Date.now()).then(r=>r.json()).then(tools=>{tools=tools.filter(t=>t.visible!==false);document.getElementById('count').textContent=tools.length+' tools';document.getElementById('grid').innerHTML=tools.map(t=>`<a class="card ${t.featured?'featured':''}" href="${t.url}" target="_blank" rel="noopener"><div class="top"><div class="keywords">${(t.keywords||[]).map(k=>`<span class="tag">${k}</span>`).join('')}</div><span class="arrow">↗</span></div><h3>${t.title}</h3><p>${t.description}</p></a>`).join('')}).catch(()=>document.getElementById('grid').innerHTML='<p>Tools konden niet geladen worden.</p>');
</script></body></html>
