<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LO-tools — Digitale tools voor lichamelijke opvoeding</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#0d0d0d;--muted:#6c6c67;--line:#d9d9d3;--soft:#ecece7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}.page{max-width:1500px;margin:auto;padding:0 38px 70px}header{height:72px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:21px}.dot{width:11px;height:11px;border-radius:50%;background:#111}.hero{min-height:390px;display:flex;align-items:flex-end;padding:50px 0 72px;border-bottom:1px solid var(--line)}h1{margin:0;max-width:1250px;font-size:clamp(54px,7.4vw,112px);line-height:.94;letter-spacing:-.065em;font-weight:760}.section-head{display:flex;justify-content:space-between;padding:44px 0 24px;font-size:17px}.section-head strong{font-size:19px}#count{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.tool{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 31px 26px;min-height:235px;display:flex;flex-direction:column}.tool.featured{grid-column:span 2;min-height:255px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.keywords{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:6px 11px 5px;font-size:13px;color:var(--muted);line-height:1}.open{color:inherit;text-decoration:none;font-size:30px;line-height:1}h2{margin:28px 0 0;font-size:clamp(31px,3vw,48px);line-height:1;letter-spacing:-.045em}.featured h2{font-size:clamp(36px,4vw,58px)}.spacer{flex:1;min-height:38px}.more{align-self:flex-start;border:0;background:none;padding:0;cursor:pointer;font:inherit;font-size:14px;font-weight:650;color:var(--muted)}.description{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}.description>div{overflow:hidden}.description p{margin:20px 0 0;padding-top:20px;border-top:1px solid var(--soft);color:var(--muted);font-size:16px;line-height:1.55;max-width:850px}.tool.expanded .description{grid-template-rows:1fr}.tool.expanded .more{margin-top:22px}.empty{color:var(--muted);padding:30px 0}@media(max-width:760px){.page{padding:0 18px 45px}header{height:62px;font-size:18px}.hero{min-height:300px;padding:42px 0 54px}h1{font-size:clamp(48px,14vw,72px);line-height:.96}.section-head{padding:34px 0 18px}.grid{grid-template-columns:1fr;gap:12px}.tool,.tool.featured{grid-column:auto;min-height:200px;padding:23px 22px 21px;border-radius:20px}h2,.featured h2{font-size:34px;margin-top:23px}.tag{font-size:12px}.description p{font-size:15px}}
</style></head><body><div class="page"><header><div>LO-tools</div><div class="dot"></div></header><main><section class="hero"><h1>Digitale tools voor lichamelijke opvoeding</h1></section><div class="section-head"><strong>Tools</strong><span id="count"></span></div><section class="grid" id="tools"></section></main></div>
<script>
const grid=document.getElementById('tools'),count=document.getElementById('count');const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(data){const tools=(Array.isArray(data)?data:data.tools||[]).filter(t=>t.visible!==false);count.textContent=`${tools.length} ${tools.length===1?'tool':'tools'}`;if(!tools.length){grid.innerHTML='<div class="empty">Nog geen tools gepubliceerd.</div>';return}grid.innerHTML=tools.map(t=>{const kws=Array.isArray(t.keywords)?t.keywords:String(t.keywords||'').split(',').map(x=>x.trim()).filter(Boolean),desc=t.description||'',url=t.link||t.url||'#';return `<article class="tool ${t.featured?'featured':''}"><div class="top"><div class="keywords">${kws.map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div><a class="open" href="${esc(url)}" target="_blank" rel="noopener" aria-label="${esc(t.title||'Tool')} openen">↗</a></div><h2>${esc(t.title||'Naamloze tool')}</h2><div class="spacer"></div>${desc?`<button class="more" type="button" aria-expanded="false">Meer informatie +</button><div class="description"><div><p>${esc(desc)}</p></div></div>`:''}</article>`}).join('');grid.querySelectorAll('.more').forEach(btn=>btn.onclick=()=>{const card=btn.closest('.tool'),x=card.classList.toggle('expanded');btn.textContent=x?'Minder −':'Meer informatie +';btn.setAttribute('aria-expanded',x)})}
fetch('tools.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render).catch(()=>grid.innerHTML='<div class="empty">De tools konden niet worden geladen.</div>');
</script></body></html>
